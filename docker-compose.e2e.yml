services:
  app-e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    ports:
      - '8088:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1']
      interval: 2s
      timeout: 2s
      retries: 30

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.0-noble
    working_dir: /work
    depends_on:
      app-e2e:
        condition: service_healthy
    environment:
      PLAYWRIGHT_BASE_URL: http://app-e2e
      CI: '1'
      HUSKY: '0'
    ports:
      - '9324:9324'
    volumes:
      - .:/work
      - playwright-node-modules:/work/node_modules
      - playwright-npm-cache:/root/.npm
    ipc: host

volumes:
  playwright-node-modules:
  playwright-npm-cache:
