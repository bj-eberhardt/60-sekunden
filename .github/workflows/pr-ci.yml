name: Pull Request CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-lint-test-e2e:
    name: Build, lint, test and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup project
        uses: ./.github/actions/setup-node-project

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Formatting check
        id: prettier
        continue-on-error: true
        run: npm run format:check

      - name: Unit tests
        id: test
        continue-on-error: true
        run: npm run test

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: E2E tests
        id: e2e
        continue-on-error: true
        env:
          CI: 'true'
        run: npm run e2e

      - name: Upload build artifact
        id: dist-artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: warn

      - name: Upload Playwright report
        id: playwright-report-artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn

      - name: Upload test results
        id: test-results-artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

      - name: Create PR comment body
        id: comment-body
        if: always()
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          PRETTIER_OUTCOME: ${{ steps.prettier.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          DIST_URL: ${{ steps.dist-artifact.outputs.artifact-url }}
          PLAYWRIGHT_REPORT_URL: ${{ steps.playwright-report-artifact.outputs.artifact-url }}
          TEST_RESULTS_URL: ${{ steps.test-results-artifact.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/workflows/pr-ci-comment.mjs > pr-ci-comment.md

      - name: Replace PR comment
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- pr-ci-comment -->';
            const body = fs.readFileSync('pr-ci-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            for (const comment of comments) {
              if (comment.user.type === 'Bot' && comment.body?.includes(marker)) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: comment.id,
                });
              }
            }
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });

      - name: Fail on unsuccessful checks
        if: >-
          steps.typecheck.outcome != 'success' ||
          steps.lint.outcome != 'success' ||
          steps.prettier.outcome != 'success' ||
          steps.test.outcome != 'success' ||
          steps.build.outcome != 'success' ||
          steps.e2e.outcome != 'success'
        run: exit 1
